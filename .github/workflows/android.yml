name: 안드로이드 APK 만들기

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: 화면 만들기
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: APK 빌드
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 파일 이름 정리
        run: cp android/app/build/outputs/apk/debug/app-debug.apk odap-note-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: odap-note-apk
          path: odap-note-${{ github.run_number }}.apk

      - name: 릴리스에 올리기 (폰에서 바로 받기)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 오답 노트 테스트 빌드 ${{ github.run_number }}
          body: 폰에서 아래 odap-note-${{ github.run_number }}.apk 를 눌러 받아 설치하세요.
          prerelease: true
          files: odap-note-${{ github.run_number }}.apk
