function navHtml() {
  const n = dueList().length;
  const live = T && T.sid === S.sid && !T.pausedAt;
  const b = (tab, icon, label, extra = '') => `<button data-tab="${tab}" class="${S.tab === tab ? 'on' : ''}">${icon}<span>${label}</span>${extra}</button>`;
  return b('home', ICON.home, '홈', n ? `<span class="badge">${n}</span>` : '') +
    b('plan', ICON.list, '계획', (() => { const l = tasksOn(S.sid, today()).filter(x => !x.done); return l.length ? `<span class="badge">${l.length}</span>` : ''; })()) +
    b('study', ICON.clock, '순공', live ? '<span class="live" aria-label="타이머 켜짐"></span>' : '') +
    `<button data-tab="upload" class="plus ${S.tab === 'upload' ? 'on' : ''}" aria-label="문제 올리기">${ICON.plus}<span class="lb">올리기</span></button>` +
    b('list', ICON.grid, '기록');
}

function whoBar() {
  const opts = S.students.map(s => `<option value="${esc(s.id)}" ${s.id === S.sid ? 'selected' : ''}>${esc(s.name)}</option>`).join('');
  const add = S.addingStudent
    ? `<input type="text" class="ctl" id="newName" placeholder="학생 이름" maxlength="20" aria-label="학생 이름"><button class="ctl solid" data-act="saveStudent">추가</button><button class="ctl" data-act="cancelStudent">취소</button>`
    : `<button class="ctl" data-act="addStudent">+ 학생</button>`;
  return `<div class="who"><span class="lbl">시제품 · 학생 보기</span>${S.students.length ? `<select class="ctl" id="sidSel" aria-label="학생 고르기">${opts}</select>` : ''}${add}</div>`;
}

function blocks(sec, goalMin) {
  const n = 12, filled = Math.min(n, Math.floor(sec / 60 / goalMin * n));
  const over = sec / 60 > goalMin;
  return `<div class="blocks" role="img" aria-label="목표의 ${Math.round(sec / 60 / goalMin * 100)}%">${Array.from({ length: n }, (_, i) => `<i class="${i < filled ? (over ? 'over' : 'on') : ''}"></i>`).join('')}</div>`;
}

function taskRow(x, opt = {}) {
  const pure = taskPure(x.id);
  const running = T && T.taskId === x.id;
  const isToday = x.date === today();
  const ro = opt.coach;
  return `<div class="task ${x.done ? 'done' : ''} ${running && !opt.mini ? 'run' : ''}">
    <button class="ck" ${ro ? 'disabled' : `data-done="${esc(x.id)}"`} role="checkbox" aria-checked="${!!x.done}" aria-label="${esc(x.text)} 완료">${ICON.save}</button>
    <div><div class="tt">${esc(x.text)}</div>${x.how ? `<div class="how"><b>어떻게</b> ${esc(x.how)}</div>` : ''}
      <div class="tm2"><span class="stag">${esc(x.subj)}</span>${x.target ? `<span class="tbar2"><i style="width:${Math.min(100, pure / 60 / x.target * 100)}%"></i></span>${hhmm(pure)} / ${dur(x.target * 60)}` : pure >= 60 ? `순공 ${hhmm(pure)}` : ''}${running ? ' · <b style="color:var(--blue)">타이머 켜짐</b>' : ''}</div></div>
    ${opt.mini || ro ? '' : `<div class="ta">${isToday && !x.done ? `<button class="icon-btn go" data-tgo="${esc(x.id)}" aria-label="이 할 일로 순공 시작">${ICON.play}</button>` : ''}<button class="icon-btn rm" data-trm="${esc(x.id)}" aria-label="삭제">${ICON.x}</button></div>`}
  </div>`;
}

function miniPlan() {
  const l = tasksOn(S.sid, today());
  const d = l.filter(x => x.done).length;
  return `<div class="h"><h2>오늘 할 일</h2><span class="aside">${l.length ? `${d}/${l.length} 완료` : ''}</span></div>
    <div class="pmini win">${l.length ? l.slice(0, 6).map(x => taskRow(x, { mini: true })).join('') : `<div class="empty" style="padding:14px 0 6px">아직 오늘 계획이 없어요.</div>`}
    <button class="btn line" data-tab="plan" style="width:100%;margin-top:8px">${ICON.list}${l.length ? '계획 전체 보기' : '오늘 계획 세우기'}</button></div>`;
}

function planView() {
  const date = S.planDate, isToday = date === today();
  const l = tasksOn(S.sid, date);
  const d = l.filter(x => x.done).length;
  const left = isToday ? leftover(S.sid) : [];
  const tf = S.tf;
  const label = isToday ? '오늘' : date === addDays(today(), 1) ? '내일' : date === addDays(today(), -1) ? '어제' : fmtShort(date);
  const head = `<div class="dnav"><button class="btn line" data-pday="-1">${ICON.back}이전</button>
      <div class="dl">${fmt(date)}<small>${label}${!isToday ? ` · <button data-pday="0">오늘로</button>` : ''}</small></div>
      <button class="btn line fwd" data-pday="1">다음${ICON.back}</button></div>
    <div class="lead"><h2>${label} <mark>할 일</mark></h2><span class="count ${l.length ? '' : 'zero'}">${d}<span style="font-size:.5em;color:var(--ink-3)">/${l.length}</span></span></div>
    ${l.length ? blocks(d * 60, l.length).replace('목표의', '계획의') : ''}
    <p class="lead-sub">${!l.length ? '무엇을 공부할지 먼저 적어 두세요.' : d === l.length ? '계획한 공부를 모두 끝냈어요.' : `남은 할 일 ${l.length - d}개 · ▶를 누르면 그 할 일로 순공 타이머가 켜져요.`}</p>`;
  const form = `<div class="addin">
      <div class="opts" role="radiogroup" aria-label="과목">${SUBJ.map(x => `<button type="button" role="radio" aria-checked="${tf.subj === x}" class="opt ${tf.subj === x ? 'on' : ''}" data-tfsubj="${x}">${x}</button>`).join('')}</div>
      <div class="trow"><input class="tin" id="tIn" type="text" maxlength="60" placeholder="무엇을: 예) 미적분 40문제 풀이" value="${esc(tf.text)}" aria-label="무엇을 공부할지"></div>
      <div class="trow"><input class="tin" id="tHow" type="text" maxlength="60" placeholder="어떻게: 예) 50분 안에 빠르게" value="${esc(tf.how)}" aria-label="어떻게 공부할지"><button class="btn solid" data-act="addTask">${ICON.plus}추가</button></div>
      <div class="tgt">${HOWS.map(h => `<button class="chip ${tf.how === h ? 'on' : ''}" data-tfhow="${esc(h)}">${esc(h)}</button>`).join('')}</div>
      <div class="tgt">목표 시간 ${[0, 30, 60, 90, 120].map(m => `<button class="chip ${tf.target === m ? 'on' : ''}" data-tftgt="${m}">${m ? dur(m * 60) : '없음'}</button>`).join('')}<button class="chip" data-act="closeAdd" style="margin-left:auto">닫기</button></div>
    </div>`;
  const list = `${left.length ? `<div class="carry"><span>지난 계획 중 못 끝낸 일 <b>${left.length}개</b></span><button class="btn solid" data-act="carry">오늘로 가져오기</button></div>` : ''}
    ${l.length || S.addOpen ? `<div class="tasks win">${l.map(x => taskRow(x)).join('')}${S.addOpen ? form : `<button class="addrow" data-act="openAdd">${ICON.plus}할 일 추가</button>`}</div>`
      : `<button class="empty win act" data-act="openAdd">${SPARK}${label} 계획이 비어 있어요.<br>눌러서 할 일을 추가해 보세요.<span class="cta">${ICON.plus}할 일 추가</span></button>`}`;
  const days = Array.from({ length: 7 }, (_, i) => addDays(today(), i - 6));
  const week = `<div class="h"><h2>최근 7일 계획 달성</h2></div>
    <div class="box win" style="margin-top:0">${days.map(dd => { const t = tasksOn(S.sid, dd).filter(x => !x.movedTo); const r = planRate(t); return `<div class="brow"><span>${fmtShort(dd)} ${'일월화수목금토'[new Date(dd + 'T00:00:00').getDay()]}</span><div class="btrack"><div class="bfill" style="width:${r}%"></div></div><span class="n">${t.length ? r + '%' : '-'}</span></div>`; }).join('')}</div>`;
  return `<div class="cols"><section>${head}${list}</section><aside class="side">${week}</aside></div>`;
}

function bindPlan() {
  const i = document.getElementById('tIn');
  i.oninput = e => S.tf.text = e.target.value;
  i.onkeydown = e => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); document.getElementById('tHow')?.focus(); } };
  const h = document.getElementById('tHow');
  if (h) { h.oninput = e => S.tf.how = e.target.value; h.onkeydown = e => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); addTask(); } }; }
}

function miniStudy() {
  const live = T && T.sid === S.sid;
  const sec = todayPure(S.sid) + (live ? tNow().pure : 0);
  return `<div class="mini win"><div><span class="k">오늘 순공 / 목표 ${dur(goalOf(S.sid) * 60)}</span><span class="v ${live && !T.pausedAt ? 'run' : ''}" ${live ? 'data-clock="mini"' : ''}>${hhmm(sec)}</span></div>
    <button class="btn ${live ? 'solid' : 'line'}" data-tab="study">${live ? (T.pausedAt ? ICON.pause + '멈춤' : ICON.clock + '진행 중') : ICON.play + '시작'}</button>
    ${blocks(sec, goalOf(S.sid))}</div>`;
}

function homeView() {
  const mine = S.entries.filter(x => x.sid === S.sid);
  const due = dueList();
  const wk = addDays(today(), -6);
  const stats = tagStats(mine.filter(x => x.date >= addDays(today(), -59)));
  const reps = stats.filter(o => o.n >= 2);
  const pats = `<div class="lead"><h2>자꾸 하는 <mark>실수</mark></h2>${reps.length ? SPARK : ''}<span class="count ${reps.length ? '' : 'zero'}">${reps.length}</span></div>
    <p class="lead-sub">${stats.length ? '최근 두 달 동안 두 번 이상 나온 패턴이에요. 시험 전에 꼭 다시 읽어 보세요.' : '오답을 올릴 때 패턴을 골라 두면, 반복되는 발상 놓침·실수가 여기에 모여요.'}</p>
    ${stats.length ? `<div class="plist win">${stats.slice(0, 5).map((o, i) => patRow(o, i)).join('')}</div>
      <button class="btn line" data-tab="list" data-lmode="pattern" style="width:100%;margin-top:8px">패턴 전체 보기 · 시험 전 체크리스트</button>`
      : `<button class="empty win act" data-tab="upload">${SPARK}틀린 문제를 올리고<br>"부호 실수", "보조선 발상"처럼 패턴을 골라 주세요.<span class="cta">${ICON.plus}첫 오답 올리기</span></button>`}`;
  const queue = due.length ? `<div class="h"><h2>오늘 다시 풀 문제</h2><span class="aside">${due.length}문제 · 사진만 보고 풀어 보기</span></div>
    ${due.map(x => `<article class="q win">
        <button class="ph" data-detail="${esc(x.id)}" style="${bgImg(x.photo)}" aria-label="${esc(x.subj)} 문제 자세히 보기"></button>
        <div>
          <div class="top"><span class="subj">${esc(x.subj)}</span><span class="when">${fmtShort(x.date)} 올림</span></div>
          <div class="meta">${clsTag(x.cls, true)}${(x.tags || []).length ? `<span class="gtags">#${(x.tags || []).map(esc).join(' #')}</span>` : ''}</div>
          ${slots(x)}
          <div class="acts"><button class="btn solid" data-review="${esc(x.id)}" data-ok="1">${ICON.ok}맞음</button><button class="btn line" data-review="${esc(x.id)}" data-ok="0">${ICON.no}틀림</button></div>
        </div></article>`).join('')}` : '';
  const thisWeek = mine.filter(x => x.date >= wk);
  const redoLeft = mine.filter(x => x.nextDue && !x.graduated).length;
  const side = `${miniPlan()}<div class="h"><h2>오늘 공부</h2></div>${miniStudy()}
    <div class="h"><h2>이번 주 오답</h2><span class="aside">최근 7일</span></div>
    <div class="sheet-grid">
      <div class="cell"><span class="k">올린 문제</span><span class="v">${thisWeek.length}</span></div>
      <div class="cell"><span class="k">발상 놓침</span><span class="v hot">${thisWeek.filter(x => typeOf(x) === '발상 놓침').length}</span></div>
      <div class="cell"><span class="k">실수</span><span class="v hot">${thisWeek.filter(x => typeOf(x) === '실수').length}</span></div>
      <div class="cell"><span class="k">다시 풀기</span><span class="v">${redoLeft}</span></div>
    </div>`;
  return `<div class="cols"><section>${pats}${queue}</section><aside class="side">${side}</aside></div>`;
}

function weekChart(sid) {
  const days = Array.from({ length: 7 }, (_, i) => addDays(today(), i - 6));
  const vals = days.map(d => pureOn(sid, d) + (T && T.sid === sid && d === today() ? tNow().pure : 0));
  const goal = goalOf(sid) * 60;
  const max = Math.max(goal, ...vals, 1);
  const rows = 12;
  return `<div class="week" role="img" aria-label="최근 7일 순공 시간">${days.map((d, i) => {
    const on = Math.round(vals[i] / max * rows);
    const g = Math.round(goal / max * rows);
    const cells = Array.from({ length: Math.max(on, g) }, (_, j) => `<i class="${j < on ? '' : 'lt'}"></i>`).join('');
    return `<div class="col ${d === today() ? 'today' : ''}"><span class="m">${vals[i] >= 60 ? hhmm(vals[i]) : ''}</span><div class="bar">${cells}</div><span class="d">${'일월화수목금토'[new Date(d + 'T00:00:00').getDay()]}</span></div>`;
  }).join('')}</div>`;
}

function studyView() {
  const mineT = T && T.sid === S.sid ? T : null;
  const otherT = T && T.sid !== S.sid;
  const t = mineT ? tNow() : { total: 0, away: 0, pure: 0 };
  const run = mineT && !mineT.pausedAt;
  const subj = mineT ? mineT.subj : S.tSubj;
  const goal = goalOf(S.sid);
  const tp = todayPure(S.sid) + t.pure;
  const list = todaySessions(S.sid);
  const acts = !mineT
    ? `<button class="btn solid wide" data-act="tStart" ${otherT ? 'disabled' : ''}>${ICON.play}순공 시작</button>`
    : S.tConfirm
      ? `<button class="btn danger" data-act="tDiscard">기록 안 하고 버리기</button><button class="btn line" data-act="tKeep">계속하기</button>`
      : `${run ? `<button class="btn line" data-act="tPause">${ICON.pause}잠깐 멈춤</button>` : `<button class="btn solid" data-act="tResume">${ICON.play}계속</button>`}
         <button class="btn dark" data-act="tStop">${ICON.save}끝내고 저장</button>
         <button class="btn ghost wide" data-act="tAsk">버리기</button>`;
  const timer = `<section class="timer win blue">
      <div class="clock ${run ? 'run' : mineT ? 'paused' : ''}" ${mineT ? 'data-clock="big"' : ''}>${clockStr(t.pure)}</div>
      <div class="tstate">${otherT ? `<b>${esc(studentName(T.sid))}</b> 학생 타이머가 켜져 있어요` : !mineT ? '과목을 고르고 시작하세요' : run ? `<b>${esc(subj)}</b> 공부 중 · ${hm(mineT.start)}부터` : `<b>${esc(subj)}</b> 멈춤`}</div>
      <div class="tsub" role="radiogroup" aria-label="과목">${SUBJ.map(s => `<button type="button" role="radio" aria-checked="${subj === s}" class="opt ${subj === s ? 'on' : ''}" data-tsubj="${s}" ${mineT ? 'disabled' : ''}>${s}</button>`).join('')}</div>
      ${(() => { if (mineT) return mineT.taskId ? `<div class="tlink"><span class="lbl">연결된 할 일</span><span class="chip on">${esc(mineT.taskText || '')}</span></div>` : ''; const tl = tasksOn(S.sid, today()).filter(x => !x.done); return tl.length && !otherT ? `<div class="tlink"><span class="lbl">오늘 할 일과 연결 (선택)</span><button class="chip ${!S.tTask ? 'on' : ''}" data-ttask="">연결 안 함</button>${tl.map(x => `<button class="chip ${S.tTask === x.id ? 'on' : ''}" data-ttask="${esc(x.id)}">${esc(x.subj)} · ${esc(x.text)}</button>`).join('')}</div>` : ''; })()}
      <div class="tacts">${acts}</div>
      <div class="away"><div><span class="k">전체</span><span class="v">${hhmm(t.total)}</span></div><div><span class="k">이탈</span><span class="v ${t.away >= 60 ? 'warn' : ''}">${hhmm(t.away)}</span></div><div><span class="k">이탈 횟수</span><span class="v ${mineT && mineT.leaves ? 'warn' : ''}">${mineT ? mineT.leaves : 0}</span></div></div>
      ${window.ODAP_EXTRA && window.ODAP_EXTRA.tip ? window.ODAP_EXTRA.tip() : `<div class="tip">${ICON.phone}<span><b>순공 타이머</b> · 공부하는 동안 이 화면을 켜 두세요.</span></div>`}
      ${S.tMsg ? `<div class="msg" role="status">${esc(S.tMsg)}</div>` : ''}
    </section>`;
  const side = `<div class="h"><h2>오늘 순공</h2><span class="aside">${fmt(today())}</span></div>
    <div class="goal win"><div class="goal-top"><span class="now">${hhmm(tp)}</span><span class="of">목표 ${dur(goal * 60)}</span></div>
      ${blocks(tp, goal)}
      <div class="goal-ctl">하루 목표 <button class="btn line" data-goal="-30">−30분</button><button class="btn line" data-goal="30">+30분</button></div></div>
    ${window.ODAP_EXTRA ? window.ODAP_EXTRA.studyPanel() : ''}
    <div class="h"><h2>최근 7일</h2></div>
    ${weekChart(S.sid)}
    <div class="h"><h2>오늘 기록</h2><span class="aside">${list.length}번</span></div>
    ${list.length ? `<div>${list.map(x => `<div class="slog"><span class="tm">${hm(x.start)}–${hm(x.end)}</span><span>${esc(x.subj)} <span class="lv">${x.leaves ? '· 이탈 ' + x.leaves + '번 ' + dur(x.away) : '· 이탈 없음'}</span></span><span class="pu">${hhmm(x.pure)}</span></div>`).join('')}</div>`
      : `<div class="empty" style="padding:18px 0">아직 오늘 저장한 공부가 없어요.</div>`}`;
  return `<div class="cols"><section>${timer}</section><aside class="side">${side}</aside></div>`;
}

function uploadView() {
  const F = S.form;
  const needOther = F.subj === '국어' || F.subj === '영어';
  const fr = S.fresh && S.fresh.kind;
  return `<form id="upForm" autocomplete="off" class="upgrid">
    <label class="drop ${F.preview ? 'has' : ''}">${F.preview ? `<img src="${F.preview}" alt="올릴 문제 사진"><span class="chg">사진 바꾸기</span>` : `${ICON.cam}<span class="big-l">문제 사진 올리기</span><small>틀린 문제가 잘 보이게 찍어 주세요</small>${CURSOR}`}<input type="file" id="fFile" accept="image/*"></label>
    <div>
    <div class="form win">
      <div class="frow"><span class="flab">날짜</span><input type="date" class="date" id="fDate" value="${esc(F.date)}" aria-label="날짜"></div>
      <div class="frow"><span class="flab">과목</span><div class="opts" role="radiogroup" aria-label="과목">${SUBJ.map(s => `<button type="button" role="radio" aria-checked="${F.subj === s}" class="opt ${F.subj === s ? 'on' : ''}" data-subj="${s}">${s}</button>`).join('')}</div></div>
      <div class="frow"><span class="flab">왜 틀렸나요 <small>하나만 고르기</small></span>
        <div class="marks" role="radiogroup" aria-label="분류">${CLS.map(c => `<button type="button" role="radio" aria-checked="${F.cls === c.k}" class="mrow ${F.cls === c.k ? 'on' : ''} ${fr === 'cls:' + c.k ? 'fresh' : ''}" data-cls="${c.k}"><span class="no">0${c.n}</span><span><span class="t">${c.k}</span><span class="d">${c.d}</span></span></button>`).join('')}</div></div>
      <div class="frow"><span class="flab">어떤 패턴이었나요 <small>최대 3개 · 같은 이름으로 모아야 반복이 보여요</small></span>${tagPicker()}</div>
      <div class="frow"><label class="flab" for="fReason">무엇을 놓쳤나 / 다음엔 이렇게</label>
        <textarea id="fReason" placeholder="예: 조건 (나)를 그래프에 표시하지 않고 풀었음. 다음엔 조건마다 그림에 먼저 표시하기.">${esc(F.reason)}</textarea></div>
      ${needOther ? `<div class="frow"><label class="flab" for="fOther">다른 선지는 왜 답이 아닌지<small>선택</small></label>
        <textarea id="fOther" placeholder="예: ③은 2문단 내용과 반대라서 답이 아님">${esc(F.other)}</textarea></div>` : ''}
      <div class="frow"><button type="button" class="redo ${F.redo ? 'on' : ''}" data-act="toggleRedo" role="checkbox" aria-checked="${F.redo}"><span class="ck">${ICON.save}</span><span><span class="t">다시 풀어볼 문제로 등록</span><span class="d">켜 두면 3일 뒤, 7일 뒤 홈의 "오늘 다시 풀 문제"에 올라와요.</span></span></button></div>
    </div>
    <button class="bigbtn" type="submit" ${S.saving ? 'disabled' : ''}>${S.saving ? '저장 중…' : '저장하기'}</button>
    ${S.formMsg ? `<div class="msg ${S.formErr ? 'err' : ''}" role="status">${esc(S.formMsg)}</div>` : ''}
    </div>
  </form>`;
}

function tagPicker() {
  const F = S.form;
  const mine = tagStats(S.entries.filter(x => x.sid === S.sid)).map(o => o.tag);
  const starter = F.cls ? (STARTER[F.cls] || []) : Object.values(STARTER).flat().slice(0, 6);
  const sug = [...new Set([...mine.slice(0, 10), ...starter])].filter(t => !F.tags.includes(t)).slice(0, 12);
  return `${F.tags.length ? `<div class="tgs">${F.tags.map(t => `<button type="button" class="tg on" data-tagadd="${esc(t)}" aria-label="${esc(t)} 빼기">#${esc(t)}${ICON.x}</button>`).join('')}</div>` : ''}
    <div class="trow" style="margin-top:${F.tags.length ? 10 : 0}px"><input class="tin" id="fTag" type="text" maxlength="20" placeholder="새 패턴 이름 (예: 부호 실수)" value="${esc(F.tagIn)}" aria-label="새 패턴" ${F.tags.length >= 3 ? 'disabled' : ''}><button type="button" class="btn line" data-act="addTag" ${F.tags.length >= 3 ? 'disabled' : ''}>${ICON.plus}추가</button></div>
    ${sug.length && F.tags.length < 3 ? `<div class="tgs" style="margin-top:10px"><span class="lbl2">${mine.length ? '내가 썼던 패턴 · 예시' : '예시'}</span>${sug.map(t => `<button type="button" class="tg sug" data-tagadd="${esc(t)}">#${esc(t)}</button>`).join('')}</div>` : ''}`;
}
function toggleTag(t) {
  t = String(t || '').trim().replace(/^#/, '').slice(0, 20); if (!t) return;
  const T2 = S.form.tags;
  if (T2.includes(t)) S.form.tags = T2.filter(x => x !== t);
  else if (T2.length < 3) S.form.tags = [...T2, t];
}

function bindForm() {
  const tg = document.getElementById('fTag');
  if (tg) { tg.oninput = e => S.form.tagIn = e.target.value; tg.onkeydown = e => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); toggleTag(tg.value); S.form.tagIn = ''; render(); document.getElementById('fTag')?.focus(); } }; }
  const g = id => document.getElementById(id);
  g('fDate').onchange = e => S.form.date = e.target.value || today();
  g('fReason').oninput = e => S.form.reason = e.target.value;
  if (g('fOther')) g('fOther').oninput = e => S.form.other = e.target.value;
  g('fFile').onchange = async e => {
    const file = e.target.files[0]; if (!file) return;
    S.form.file = file; S.form.preview = await shrink(file, 900, 0.7); render();
  };
  g('upForm').onsubmit = e => { e.preventDefault(); saveEntry(); };
}

function filterRows() {
  const subj = ['전체', ...SUBJ].map(v => `<button class="chip ${S.f.subj === v ? 'on' : ''}" data-fsubj="${v}">${v}</button>`).join('');
  const tagRow = S.f.tag ? `<div class="chiprow" style="margin-top:8px"><button class="tg on" data-ftagclear="1">#${esc(S.f.tag)} ${ICON.x}</button></div>` : '';
  const cls = ['전체', ...CLS.map(c => c.k)].map(v => {
    const c = CLS.find(x => x.k === v);
    return `<button class="chip ${S.f.cls === v ? 'on' : ''}" data-fcls="${v}">${c ? bub(c.n, true, 'sm') : ''}${v}</button>`;
  }).join('');
  return `<div class="chiprow">${subj}</div><div class="chiprow" style="margin-top:8px">${cls}</div>${tagRow}`;
}

function gridOf(list) {
  if (!list.length) return `<div class="empty win" style="margin-top:16px">${SPARK}조건에 맞는 기록이 없어요.</div>`;
  list = [...list].sort((a, b) => b.date.localeCompare(a.date) || (b.createdAt || 0) - (a.createdAt || 0));
  const groups = [];
  for (const x of list) { const g = groups[groups.length - 1]; if (g && g.date === x.date) g.items.push(x); else groups.push({ date: x.date, items: [x] }); }
  return groups.map(g => `<div class="day">${fmt(g.date)}<span>${g.items.length}문제</span></div><div class="grid">${g.items.map(x => `<button class="gcard" data-detail="${esc(x.id)}">
      <div class="ph" style="${bgImg(x.photo)}">${x.graduated ? stamp() : ''}</div>
      <div class="cap">${bub(clsOf(x.cls).n, true, 'sm')}${esc(x.subj)} <span class="cl">${esc(clsOf(x.cls).k)}</span></div>${(x.tags || []).length ? `<div class="gtags">#${x.tags.map(esc).join(' #')}</div>` : ''}</button>`).join('')}</div>`).join('');
}

function listView() {
  const mode = `<div class="lmode" role="tablist"><button class="${S.listMode === 'pattern' ? 'on' : ''}" data-lmode="pattern">패턴 분석</button><button class="${S.listMode === 'all' ? 'on' : ''}" data-lmode="all">전체 기록</button></div>`;
  if (S.listMode === 'pattern') return mode + patternView(S.sid);
  const list = S.entries.filter(x => x.sid === S.sid && (S.f.subj === '전체' || x.subj === S.f.subj) && (S.f.cls === '전체' || typeOf(x) === S.f.cls) && (!S.f.tag || (x.tags || []).includes(S.f.tag)));
  return mode + `<div class="h" style="margin-top:0"><h2>내 기록</h2><span class="aside">${list.length}문제</span></div>` + filterRows() + gridOf(list);
}

function patternView(sid, coach) {
  const P = [['month', '최근 30일'], ['quarter', '최근 90일'], ['all', '전체']];
  const per = S.ppd || 'quarter';
  const from = per === 'month' ? addDays(today(), -29) : per === 'quarter' ? addDays(today(), -89) : '0000';
  const list = S.entries.filter(x => x.sid === sid && x.date >= from);
  const stats = tagStats(list);
  const untagged = list.filter(x => !(x.tags || []).length).length;
  const main = `<div class="lead"><h2>자꾸 하는 <mark>실수</mark></h2><span class="count ${stats.length ? '' : 'zero'}">${stats.filter(o => o.n >= 2).length}</span></div>
    <p class="lead-sub">많이 나온 순서예요. 눌러 보면 그 패턴으로 틀린 문제만 모아 볼 수 있어요.</p>
    <div class="chiprow" style="margin-bottom:12px">${P.map(([k, l]) => `<button class="chip ${per === k ? 'on' : ''}" data-ppd="${k}">${l}</button>`).join('')}</div>
    ${stats.length ? `<div class="plist win">${stats.map((o, i) => patRow(o, i, { static: coach })).join('')}</div>` : `<button class="empty win act" data-tab="upload">${SPARK}아직 패턴이 붙은 오답이 없어요.<span class="cta">${ICON.plus}오답 올리기</span></button>`}
    ${untagged ? `<p class="muted" style="margin-top:10px">패턴을 안 고른 오답 ${untagged}개 · 기록에서 열어 패턴을 붙이면 여기에 합쳐져요.</p>` : ''}`;
  const side = `<div class="h" style="margin-top:0"><h2>유형별</h2><span class="aside">${list.length}문제</span></div>
    <div class="box win" style="margin-top:0">${bars(CLS.map(c => c.k), list, typeOf, false, k => `<span class="ctag">${bub(clsOf(k).n, true, 'sm')}${k}</span>`)}</div>
    <div class="h"><h2>과목별</h2></div>
    <div class="box win" style="margin-top:0">${bars(SUBJ, list, 'subj', true)}</div>
    <div class="h"><h2>시험 전 체크리스트</h2><span class="aside">시험 직전에 읽기</span></div>
    <div class="box win" style="margin-top:0"><textarea class="exam" id="examBox" aria-label="시험 전 체크리스트">${esc(stats.length ? examText(stats) : '패턴이 쌓이면 여기에 "시험 볼 때 조심할 것" 목록이 만들어져요.')}</textarea>
      <div class="rowb" style="margin-top:10px"><button class="btn solid" data-act="copyExam">${S.copiedExam ? '복사했어요' : '체크리스트 복사'}</button></div></div>`;
  return `<div class="cols"><section>${main}</section><aside class="side">${side}</aside></div>`;
}

// ---------- 상세 시트 ----------
function renderSheet() {
  const root = document.getElementById('sheetRoot');
  const x = S.detail && S.entries.find(e => e.id === S.detail);
  if (!x) { root.innerHTML = ''; return; }
  const coach = S.mode === 'coach';
  const src = photoSrc(x.photo);
  root.innerHTML = `<div class="sheet-bg" data-close="1"><div class="sheet win" role="dialog" aria-modal="true" aria-label="${esc(x.subj)} 오답">
    ${src ? `<div class="shotwrap"><img class="shot" src="${src}" alt="${esc(x.subj)} 문제 사진">${x.graduated ? stamp() : ''}</div>` : ''}
    <div class="smeta"><span class="subj">${esc(x.subj)} ${clsTag(x.cls)}</span><span class="muted">${fmt(x.date)}</span></div>
    ${coach ? ((x.tags || []).length ? `<div class="tgs" style="margin-top:12px">${x.tags.map(t => `<span class="tg">#${esc(t)}</span>`).join('')}</div>` : '')
      : `<div class="tgs" style="margin-top:12px">${(x.tags || []).map(t => `<button class="tg" data-ptag="${esc(t)}">#${esc(t)}</button><button class="tg sug" data-etagrm="${esc(t)}" aria-label="${esc(t)} 패턴 빼기">${ICON.x}</button>`).join('')}</div>
         ${(x.tags || []).length < 3 ? `<div class="trow"><input class="tin" id="eTag" type="text" maxlength="20" placeholder="${(x.tags || []).length ? '패턴 더 붙이기' : '패턴 붙이기 (예: 부호 실수)'}" aria-label="패턴 붙이기" list="tagList"><button class="btn line" data-act="etagadd">${ICON.plus}붙이기</button></div>
         <datalist id="tagList">${tagStats(S.entries.filter(e => e.sid === x.sid)).map(o => `<option value="${esc(o.tag)}">`).join('')}</datalist>` : ''}`}
    ${x.nextDue || x.graduated ? `<div class="sline"><div>${(x.reviews || []).length || !x.graduated ? slots(x) : ''}</div>
      <span class="muted" style="text-align:right">${x.graduated ? '두 번 연속 맞혀<br>졸업했어요' : '다음 다시 풀기<br><b>' + fmt(x.nextDue) + '</b>'}${!coach && !x.graduated ? `<br><button class="btn ghost" style="height:28px;font-size:12px;margin-top:4px" data-unredo="${esc(x.id)}">다시 풀기에서 빼기</button>` : ''}</span></div>`
      : !coach ? `<div class="sline"><span class="muted">다시 풀기에 등록하지 않은 문제예요.</span><button class="btn line" style="height:34px;font-size:13px" data-redo="${esc(x.id)}">다시 풀기에 등록</button></div>` : ''}
    <div class="txt"><span class="k">무엇을 놓쳤나 / 다음엔</span>${esc(x.reason)}</div>
    ${x.other ? `<div class="txt"><span class="k">다른 선지</span>${esc(x.other)}</div>` : ''}
    ${coach
      ? `<div class="txt"><label class="k" for="cmtBox">코멘트</label><textarea id="cmtBox" placeholder="학생에게 남길 말">${esc(x.comment)}</textarea></div>
         <div class="rowb"><button class="btn solid" data-savecmt="${esc(x.id)}">코멘트 저장</button><button class="btn line" data-close="1">닫기</button></div>`
      : `${x.comment ? `<div class="txt cmt"><span class="k">선생님 코멘트</span>${esc(x.comment)}</div>` : ''}
         <div class="rowb">${S.confirmDel
           ? `<button class="btn danger" data-del="${esc(x.id)}">정말 삭제</button><button class="btn line" data-act="cancelDel">취소</button>`
           : `<button class="btn line" data-close="1">닫기</button><button class="btn ghost" data-act="askDel">삭제</button>`}</div>`}
  </div></div>`;
}

// ---------- 코치 화면 ----------
function coachList() {
  if (!S.students.length) return `<div class="empty win">${SPARK}학생에게 내 전화번호 뒷자리 4개를 알려 주세요. 학생이 그 번호로 선생님을 찾아 들어오면 여기에 모여요.</div>`;
  const wk = addDays(today(), -6);
  const dueAll = S.students.reduce((n, s) => n + dueList(s.id).length, 0);
  const rows = S.students.map(s => {
    const mine = S.entries.filter(x => x.sid === s.id);
    const tl = tasksOn(s.id, today());
    const top = tagStats(mine.filter(x => x.date >= addDays(today(), -29)))[0];
    return { s, last: mine.map(x => x.date).sort().pop(), due: dueList(s.id).length, wk: mine.filter(x => x.date >= wk).length, pure: todayPure(s.id), td: tl.filter(x => x.done).length, tt: tl.length, top };
  }).sort((a, b) => b.due - a.due);
  const weekPure = S.sessions.filter(x => x.date >= wk).reduce((n, x) => n + (x.pure || 0), 0);
  return `<div class="cols"><section>
    <div class="lead"><h2><mark>밀린</mark> 다시 풀기</h2>${dueAll ? SPARK : ''}<span class="count ${dueAll ? '' : 'zero'}">${dueAll}</span></div>
    <p class="lead-sub">학생 ${S.students.length}명 · 밀린 학생이 위로 올라와요.</p>
    <div class="win" style="padding:0 10px 4px">` +
    rows.map(r => `<button class="srow" data-open="${esc(r.s.id)}"><span class="avatar">${esc(r.s.name.slice(0, 1))}</span>
        <span><span class="t">${esc(r.s.name)}</span><span class="s">오늘 순공 <b>${hhmm(r.pure)}</b> · 계획 <b>${r.tt ? r.td + '/' + r.tt : '없음'}</b> · 최근 7일 ${r.wk}문제${r.top ? ` · 자꾸 <b>#${esc(r.top.tag)}</b> ${r.top.n}번` : ''}</span></span>
        ${r.due ? `<span class="due">밀림 ${r.due}</span>` : '<span class="ok">밀림 없음</span>'}</button>`).join('') +
    `</div></section><aside class="side">
    <div class="h"><h2>전체</h2><span class="aside">최근 7일</span></div>
    <div class="sheet-grid c2"><div class="cell"><span class="k">올라온 문제</span><span class="v">${S.entries.filter(x => x.date >= wk).length}</span></div>
      <div class="cell"><span class="k">순공 합계</span><span class="v hot">${hhmm(weekPure)}</span></div></div></aside></div>`;
}

function bars(keys, list, field, alt, label) {
  const get = typeof field === 'function' ? field : x => x[field];
  const counts = keys.map(k => list.filter(x => get(x) === k).length);
  const max = Math.max(1, ...counts);
  return keys.map((k, i) => `<div class="brow"><span>${label ? label(k) : k}</span><div class="btrack"><div class="bfill ${alt ? 'alt' : ''}" style="width:${counts[i] / max * 100}%"></div></div><span class="n">${counts[i]}</span></div>`).join('');
}

function periodLabel() { return S.period === 'week' ? '최근 7일' : S.period === 'month' ? '최근 30일' : '지금까지'; }

function reportText(sid, list, ses, tks = []) {
  const bySubj = SUBJ.map(k => [k, list.filter(x => x.subj === k).length]).filter(v => v[1]);
  const byCls = CLS.map(c => [c.k, list.filter(x => typeOf(x) === c.k).length]).filter(v => v[1]);
  const grad = list.filter(x => x.graduated).length;
  const redo = list.filter(x => x.nextDue || x.graduated).length;
  const pats = tagStats(list).slice(0, 3);
  const top = [...bySubj].sort((a, b) => b[1] - a[1])[0];
  const pure = ses.reduce((n, x) => n + (x.pure || 0), 0);
  const days = new Set(ses.map(x => x.date)).size;
  return `${studentName(sid)} 학생 ${periodLabel()} 학습 기록\n` +
    `- 순공 시간: ${dur(pure)}${days ? ` (공부한 날 ${days}일, 하루 평균 ${dur(pure / days)})` : ''}\n` +
    (tks.length ? `- 학습 계획: ${tks.length}개 중 ${tks.filter(x => x.done).length}개 완료 (${planRate(tks)}%)\n` : '') +
    `- 올린 오답: ${list.length}개${bySubj.length ? ' (' + bySubj.map(v => v[0] + ' ' + v[1]).join(', ') + ')' : ''}\n` +
    (byCls.length ? `- 틀린 이유: ${byCls.map(v => v[0] + ' ' + v[1]).join(', ')}\n` : '') +
    (pats.length ? `- 자주 반복된 실수: ${pats.map(o => o.tag + ' ' + o.n + '번').join(', ')}\n` : '') +
    `- 다시 풀기: 등록 ${redo}개 중 졸업 ${grad}개` +
    (top ? `\n- 가장 많이 기록한 과목: ${top[0]}` : '');
}

function coachDetail(sid) {
  const list = S.entries.filter(x => x.sid === sid && inPeriod(x.date));
  const ses = S.sessions.filter(x => x.sid === sid && inPeriod(x.date));
  const pure = ses.reduce((n, x) => n + (x.pure || 0), 0);
  const tks = S.tasks.filter(x => x.sid === sid && inPeriod(x.date) && x.date <= today() && !x.movedTo);
  const leaves = ses.reduce((n, x) => n + (x.leaves || 0), 0);
  const grad = list.filter(x => x.graduated).length;
  const due = dueList(sid).length;
  const per = [['week', '최근 7일'], ['month', '최근 30일'], ['all', '전체']].map(([k, l]) => `<button class="chip ${S.period === k ? 'on' : ''}" data-period="${k}">${l}</button>`).join('');
  return `<div style="margin-bottom:16px"><button class="back" data-act="back">${ICON.back}학생 목록</button></div>
    <div class="h" style="margin-top:0"><h2 class="big">${esc(studentName(sid))} 학생 리포트</h2></div>
    <div class="chiprow">${per}</div>
    <div class="sheet-grid" style="margin-top:12px">
      <div class="cell"><span class="k">순공</span><span class="v hot">${hhmm(pure)}</span></div>
      <div class="cell"><span class="k">이탈</span><span class="v">${leaves}<small>번</small></span></div>
      <div class="cell"><span class="k">올린 오답</span><span class="v">${list.length}</span></div>
      <div class="cell"><span class="k">계획 달성</span><span class="v">${tks.length ? planRate(tks) : '-'}<small>${tks.length ? '%' : ''}</small></span></div>
    </div>
    <div class="cols" style="margin-top:4px"><section>
      <div class="h" style="margin-top:12px"><h2>오늘 할 일</h2><span class="aside">밀린 다시 풀기 ${due}개</span></div>
      ${tasksOn(sid, today()).length ? `<div class="tasks win">${tasksOn(sid, today()).map(x => taskRow(x, { coach: true })).join('')}</div>` : '<div class="empty win" style="padding-bottom:16px">오늘 계획이 없어요.</div>'}
      <div class="box win"><div class="flab">최근 7일 순공 <small>목표 ${dur(goalOf(sid) * 60)}</small></div>${weekChart(sid)}</div>
      <div class="h"><h2>반복 패턴</h2><span class="aside">${periodLabel()}</span></div>
      ${tagStats(list).length ? `<div class="plist win">${tagStats(list).slice(0, 6).map((o, i) => patRow(o, i, { static: true })).join('')}</div>` : '<div class="empty win" style="padding-bottom:16px">패턴이 붙은 오답이 없어요.</div>'}
      <div class="box win"><div class="flab">유형별</div>${bars(CLS.map(c => c.k), list, typeOf, false, k => `<span class="ctag">${bub(clsOf(k).n, true, 'sm')}${k}</span>`)}</div>
      <div class="box win"><div class="flab">과목</div>${bars(SUBJ, list, 'subj', true)}</div>
    </section><aside class="side">
      <div class="box win"><label class="flab" for="reportBox">학부모 리포트 초안</label>
        <textarea class="report" id="reportBox">${esc(reportText(sid, list, ses, tks))}</textarea>
        <div class="rowb" style="margin-top:10px"><button class="btn solid" data-act="copy">${S.copied ? '복사했어요' : '리포트 복사'}</button></div></div>
      <div class="h"><h2>오답 기록</h2><span class="aside">눌러서 코멘트 남기기</span></div>
      ${gridOf(list)}
    </aside></div>`;
}

// ---------- 동작 ----------
document.addEventListener('click', async e => {
  const t = e.target.closest('button, [data-detail], [data-open], [data-close], img.shot');
  if (!t) return;
  const d = t.dataset;
  if (t.matches('img.shot')) { const v = document.getElementById('viewer'); v.querySelector('img').src = t.src; v.hidden = false; return; }
  if (d.close) { if (e.target === t || t.tagName === 'BUTTON') { S.detail = null; S.confirmDel = false; render(); } return; }
  if (d.mode) return;
  if (d.tab) { if (d.lmode) S.listMode = d.lmode; S.tab = d.tab; S.formMsg = ''; S.tMsg = ''; window.scrollTo(0, 0); render(); return; }
  if (d.subj) { S.form.subj = d.subj; S.formMsg = ''; render(); return; }
  if (d.cls) { S.form.cls = d.cls; S.formMsg = ''; flash('cls:' + d.cls); return; }
  if (d.tsubj) { S.tSubj = d.tsubj; S.tTask = ''; render(); return; }
  if (d.ttask !== undefined) { S.tTask = d.ttask; const k = S.tasks.find(x => x.id === d.ttask); if (k) S.tSubj = k.subj; render(); return; }
  if (d.tfsubj) { S.tf.subj = d.tfsubj; render(); return; }
  if (d.tfhow !== undefined) { S.tf.how = S.tf.how === d.tfhow ? '' : d.tfhow; render(); document.getElementById('tHow')?.focus(); return; }
  if (d.tftgt !== undefined) { S.tf.target = +d.tftgt; render(); return; }
  if (d.pday !== undefined) { S.planDate = +d.pday === 0 ? today() : addDays(S.planDate, +d.pday); render(); return; }
  if (d.done) { await toggleTask(d.done); return; }
  if (d.trm) { await removeTask(d.trm); return; }
  if (d.tgo) { const k = S.tasks.find(x => x.id === d.tgo); if (!k) return; S.tab = 'study'; window.scrollTo(0, 0); if (T) { S.tMsg = '이미 켜진 타이머가 있어요. 먼저 끝내고 시작해 주세요.'; render(); return; } startTimer(k.id); return; }
  if (d.goal) { await setGoal(+d.goal); return; }
  if (d.fsubj) { S.f.subj = d.fsubj; render(); return; }
  if (d.fcls) { S.f.cls = d.fcls; render(); return; }
  if (d.ftagclear) { S.f.tag = ''; render(); return; }
  if (d.lmode && !d.tab) { S.listMode = d.lmode; render(); return; }
  if (d.ppd) { S.ppd = d.ppd; render(); return; }
  if (d.ptag !== undefined) { if (S.mode === 'coach') return; S.f = { subj: '전체', cls: '전체', tag: d.ptag }; S.listMode = 'all'; S.tab = 'list'; S.detail = null; window.scrollTo(0, 0); render(); return; }
  if (d.etagrm !== undefined) { await editTags(S.detail, d.etagrm, false); return; }
  if (d.tagadd !== undefined) { toggleTag(d.tagadd); render(); return; }
  if (d.redo) { const x = S.entries.find(e => e.id === d.redo); if (x) { const sch = schedule(today(), []); try { await S.db.doc('entries/' + x.id).update({ reviews: [], nextDue: sch.nextDue, graduated: false }); } catch (err) { setNote(writeErr(err)); } } return; }
  if (d.unredo) { try { await S.db.doc('entries/' + d.unredo).update({ nextDue: null }); } catch (err) { setNote(writeErr(err)); } return; }
  if (d.detail) { S.detail = d.detail; S.confirmDel = false; render(); return; }
  if (d.open) { S.coachSid = d.open; S.copied = false; window.scrollTo(0, 0); render(); return; }
  if (d.period) { S.period = d.period; S.copied = false; render(); return; }
  if (d.review) { await doReview(d.review, d.ok === '1'); return; }
  if (d.del) { await doDelete(d.del); return; }
  if (d.savecmt) { await saveComment(d.savecmt, t); return; }
  switch (d.act) {
    case 'addStudent': S.addingStudent = true; render(); document.getElementById('newName')?.focus(); break;
    case 'cancelStudent': S.addingStudent = false; render(); break;
    case 'saveStudent': await addStudent(); break;
    case 'askDel': S.confirmDel = true; renderSheet(); break;
    case 'cancelDel': S.confirmDel = false; renderSheet(); break;
    case 'back': S.coachSid = null; render(); break;
    case 'tStart': startTimer(S.tTask); break;
    case 'addTask': await addTask(); break;
    case 'openAdd': S.addOpen = true; render(); document.getElementById('tIn')?.focus(); break;
    case 'closeAdd': S.addOpen = false; render(); break;
    case 'addTag': { const v = document.getElementById('fTag')?.value || S.form.tagIn; toggleTag(v); S.form.tagIn = ''; render(); document.getElementById('fTag')?.focus(); break; }
    case 'etagadd': await editTags(S.detail, (document.getElementById('eTag')?.value || '').trim(), true); break;
    case 'toggleRedo': S.form.redo = !S.form.redo; render(); break;
    case 'copyExam': { const box = document.getElementById('examBox'); try { await navigator.clipboard.writeText(box.value); S.copiedExam = true; render(); setTimeout(() => { S.copiedExam = false; }, 1500); } catch (err) { box.focus(); box.select(); } break; }
    case 'carry': await carryOver(); break;
    case 'tPause': T.pausedAt = Date.now(); saveT(); releaseAwake(); render(); break;
    case 'tResume': T.pauseMs += Date.now() - T.pausedAt; T.pausedAt = null; saveT(); keepAwake(); render(); break;
    case 'tAsk': S.tConfirm = true; render(); break;
    case 'tKeep': S.tConfirm = false; render(); break;
    case 'tDiscard': T = null; saveT(); S.tConfirm = false; releaseAwake(); S.tMsg = '기록하지 않고 버렸어요.'; render(); break;
    case 'tStop': await stopTimer(); break;
    case 'copy': {
      const box = document.getElementById('reportBox');
      try { await navigator.clipboard.writeText(box.value); S.copied = true; render(); }
      catch (err) { box.focus(); box.select(); }
      break;
    }
  }
});
document.addEventListener('change', e => {
  if (e.target.id === 'sidSel') { S.sid = e.target.value; S.form = blankForm(); S.formMsg = ''; S.tMsg = ''; render(); }
});
document.addEventListener('keydown', e => {
  if (e.target.id === 'newName' && e.key === 'Enter') { e.preventDefault(); addStudent(); }
  if (e.target.id === 'eTag' && e.key === 'Enter' && !e.isComposing) { e.preventDefault(); editTags(S.detail, e.target.value, true); }
  if (e.key === 'Escape' && S.detail) { S.detail = null; render(); }
});
document.getElementById('viewer').addEventListener('click', e => { e.currentTarget.hidden = true; });

function flash(kind, id) { S.fresh = { kind, id }; render(); clearTimeout(flash.t); flash.t = setTimeout(() => { S.fresh = null; }, 700); }

function startTimer(taskId) {
  const k = taskId ? S.tasks.find(x => x.id === taskId) : null;
  T = { sid: S.sid, subj: k ? k.subj : S.tSubj, taskId: k ? k.id : '', taskText: k ? k.text : '', start: Date.now(), pauseMs: 0, pausedAt: null, awayMs: 0, leaves: 0, hiddenAt: null };
  saveT(); S.tMsg = ''; S.tTask = ''; keepAwake(); render();
}

async function editTags(id, tag, add) {
  const x = S.entries.find(e => e.id === id); tag = String(tag || '').replace(/^#/, '').trim().slice(0, 20);
  if (!x || !tag) return;
  const cur = x.tags || [];
  const next = add ? (cur.includes(tag) || cur.length >= 3 ? cur : [...cur, tag]) : cur.filter(t => t !== tag);
  try { await S.db.doc('entries/' + id).update({ tags: next }); } catch (err) { setNote(writeErr(err)); }
}

async function addTask() {
  const text = (document.getElementById('tIn')?.value || S.tf.text).trim();
  if (!text) { document.getElementById('tIn')?.focus(); return; }
  try {
    const how = (document.getElementById('tHow')?.value || S.tf.how).trim();
    await S.db.collection('tasks').doc().set({ sid: S.sid, date: S.planDate, subj: S.tf.subj, text, how, target: S.tf.target, done: false, createdAt: Date.now() });
    S.tf.text = ''; S.tf.how = ''; render(); document.getElementById('tIn')?.focus();
  } catch (err) { setNote(writeErr(err)); }
}
async function toggleTask(id) {
  const k = S.tasks.find(x => x.id === id); if (!k) return;
  try { await S.db.doc('tasks/' + id).update({ done: !k.done, doneAt: !k.done ? Date.now() : null }); } catch (err) { setNote(writeErr(err)); }
}
async function removeTask(id) {
  try { await S.db.doc('tasks/' + id).delete(); } catch (err) { setNote(writeErr(err)); }
}
async function carryOver() {
  const t = today();
  try {
    for (const k of leftover(S.sid)) {
      await S.db.collection('tasks').doc().set({ sid: k.sid, date: t, subj: k.subj, text: k.text, how: k.how || '', target: k.target || 0, done: false, from: k.date, createdAt: Date.now() });
      await S.db.doc('tasks/' + k.id).update({ movedTo: t });
    }
  } catch (err) { setNote(writeErr(err)); }
}

async function stopTimer() {
  if (T.pausedAt) { T.pauseMs += Date.now() - T.pausedAt; T.pausedAt = null; }
  const t = tNow(), end = Date.now();
  if (t.total < 60) { T = null; saveT(); releaseAwake(); S.tMsg = '1분이 안 돼서 저장하지 않았어요.'; render(); return; }
  const rec = { sid: T.sid, subj: T.subj, taskId: T.taskId || '', taskText: T.taskText || '', date: dayOf(T.start), start: T.start, end, total: Math.round(t.total), away: Math.round(t.away), pure: Math.round(t.pure), leaves: T.leaves, createdAt: end };
  try {
    await S.db.collection('sessions').doc().set(rec);
    T = null; saveT(); releaseAwake();
    S.tMsg = `순공 ${dur(rec.pure)} 저장했어요.` + (rec.leaves ? ` 이탈 ${rec.leaves}번(${dur(rec.away)})은 뺐어요.` : ' 이탈 없이 집중했어요!');
  } catch (err) { S.tMsg = writeErr(err); }
  render();
}

async function setGoal(delta) {
  const g = Math.min(720, Math.max(30, goalOf(S.sid) + delta));
  try { await S.db.doc('students/' + S.sid).update({ goal: g }); } catch (err) { setNote(writeErr(err)); }
}

async function addStudent() {
  const name = (document.getElementById('newName')?.value || '').trim();
  if (!name) return;
  try {
    const ref = S.db.collection('students').doc();
    await ref.set({ name, goal: DEFAULT_GOAL, createdAt: Date.now() });
    S.sid = ref.id; S.addingStudent = false; render();
  } catch (err) { setNote(writeErr(err)); }
}

async function saveEntry() {
  const F = S.form;
  if (!F.file) return formMsg('문제 사진을 올려 주세요.', true);
  if (!F.subj) return formMsg('과목을 골라 주세요.', true);
  if (!F.cls) return formMsg('왜 틀렸는지 유형을 하나 골라 주세요.', true);
  const pend = (document.getElementById('fTag')?.value || '').trim(); if (pend) toggleTag(pend);
  if (F.reason.trim().length < 5) return formMsg('왜 틀렸는지를 조금 더 적어 주세요.', true);
  S.saving = true; S.formMsg = ''; render();
  try {
    let photo = null;
    if (S.assets) {
      try { const blob = await shrinkBlob(F.file, 1400, 0.82); const up = await S.assets.upload(blob, { type: 'image/jpeg' }); photo = { id: up.id }; }
      catch (err) { photo = null; }
    }
    if (!photo) photo = { data: await shrink(F.file, 900, 0.6) };
    const sch = schedule(F.date, []);
    await S.db.collection('entries').doc().set({
      sid: S.sid, date: F.date, subj: F.subj, cls: F.cls,
      reason: F.reason.trim(), other: (F.subj === '국어' || F.subj === '영어') ? F.other.trim() : '',
      tags: F.tags, photo, reviews: [], nextDue: F.redo ? sch.nextDue : null, graduated: false, comment: '', createdAt: Date.now(),
    });
    const redo = F.redo, tags = F.tags;
    S.form = blankForm(); S.saving = false; S.formErr = false;
    S.formMsg = '저장했어요.' + (tags.length ? ` #${tags.join(' #')} 패턴에 모였어요.` : '') + (redo ? ` ${fmt(sch.nextDue)}에 다시 풀기로 올라와요.` : '');
    render();
  } catch (err) { S.saving = false; formMsg(writeErr(err), true); }
}
function formMsg(m, err) { S.formMsg = m; S.formErr = !!err; render(); }

async function doReview(id, ok) {
  const x = S.entries.find(e => e.id === id); if (!x) return;
  const reviews = [...(x.reviews || []), { on: today(), ok }];
  const sch = schedule(x.date, reviews);
  S.fresh = { kind: 'review', id }; clearTimeout(flash.t); flash.t = setTimeout(() => { S.fresh = null; }, 900);
  try { await S.db.doc('entries/' + id).update({ reviews, nextDue: sch.nextDue, graduated: sch.graduated }); }
  catch (err) { setNote(writeErr(err)); }
}

async function doDelete(id) {
  const x = S.entries.find(e => e.id === id);
  try {
    await S.db.doc('entries/' + id).delete();
    if (x?.photo?.id && S.assets) { try { await S.assets.delete(x.photo.id); } catch (e) {} }
  } catch (err) { setNote(writeErr(err)); }
  S.detail = null; S.confirmDel = false; render();
}

async function saveComment(id, btn) {
  const val = (document.getElementById('cmtBox')?.value || '').trim();
  btn.disabled = true; btn.textContent = '저장 중…';
  try { await S.db.doc('entries/' + id).update({ comment: val }); btn.textContent = '저장했어요'; }
  catch (err) { btn.textContent = '코멘트 저장'; setNote(writeErr(err)); }
  btn.disabled = false;
}

function writeErr(err) {
  if (err?.code === 'invalid_argument') return '저장 권한이 없어요. 이 페이지는 만든 사람만 저장할 수 있어요.';
  if (err?.code === 'quota_exceeded') return '저장 공간이 가득 찼어요. 오래된 기록을 지워 주세요.';
  return '저장하지 못했어요. 잠시 뒤 다시 해 주세요.';
}

// ---------- 사진 줄이기 ----------
function loadImg(file) { return new Promise((res, rej) => { const u = URL.createObjectURL(file); const i = new Image(); i.onload = () => { URL.revokeObjectURL(u); res(i); }; i.onerror = rej; i.src = u; }); }
async function drawCanvas(file, max) {
  const img = await loadImg(file);
  const r = Math.min(1, max / Math.max(img.width, img.height));
  const c = document.createElement('canvas'); c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
  const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
  return c;
}
async function shrink(file, max, q) { let c = await drawCanvas(file, max), url = c.toDataURL('image/jpeg', q); while (url.length > 200000 && q > 0.3) { q -= 0.1; url = c.toDataURL('image/jpeg', q); } return url; }
async function shrinkBlob(file, max, q) { const c = await drawCanvas(file, max); return new Promise(res => c.toBlob(res, 'image/jpeg', q)); }

// 앱 레이어(fb.js)가 순공 중 되돌아왔을 때 타이머 화면을 띄우는 데 쓴다
window.ODAP_GO = tab => { if (S.mode === 'student' && S.tab !== tab) { S.tab = tab; S.detail = null; window.scrollTo(0, 0); render(); } };
render();
</script>
